# Bring this up with an explicit project name so it cannot collide with the XrplCSharp stand:
#   docker compose -p xrplpg-ci -f .ci-config/docker-compose.ci.yml up -d
# By default it publishes the same ports as the XrplCSharp stand, so only one of the two can run.
# To run both, give this one different host ports and tell the tests where to look:
#   XRPLPG_ADMIN_WS_PORT=16006 XRPLPG_POSTGRES_PORT=55433 docker compose -p xrplpg-ci -f .ci-config/docker-compose.ci.yml up -d
#   XRPLPG_NODE_URL=ws://localhost:16006 XRPLPG_POSTGRES="Host=localhost;Port=55433;Username=xrplpg;Password=xrplpg;Database=xrplpg" dotnet run ...
# The container ports never change, so the ledger-acceptor and rippled.cfg are unaffected.
services:
  xrpld:
    image: xrpllabsofficial/xrpld:3.3.0
    container_name: xrplpg-rippled
    command: ["-a", "--start"]
    ports:
      # Loopback only: every port below grants the admin role, which means node control, not just reads.
      - "127.0.0.1:${XRPLPG_RPC_PORT:-5005}:5005"
      - "127.0.0.1:${XRPLPG_WS_PORT:-5006}:5006"
      - "127.0.0.1:${XRPLPG_ADMIN_WS_PORT:-6006}:6006"
    volumes:
      - ./rippled.cfg:/config/rippled.cfg:ro
      - ./validators.txt:/config/validators.txt:ro

  ledger-acceptor:
    image: curlimages/curl:latest
    container_name: xrplpg-ledger-acceptor
    depends_on:
      - xrpld
    entrypoint:
      - sh
      - -c
      - |
        sleep 3
        while true; do
          curl -s -X POST http://xrpld:5006/ \
            -H "Content-Type: application/json" \
            -d '{"method":"ledger_accept"}'
          sleep 4
        done
    restart: unless-stopped

  # The Postgres store's contract tests run against this. A throwaway database: every test creates its
  # own schema and drops it, so nothing needs to persist between runs.
  postgres:
    image: postgres:17-alpine
    container_name: xrplpg-postgres
    environment:
      POSTGRES_PASSWORD: xrplpg
      POSTGRES_USER: xrplpg
      POSTGRES_DB: xrplpg
    ports:
      - "127.0.0.1:${XRPLPG_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xrplpg"]
      interval: 2s
      timeout: 3s
      retries: 30
